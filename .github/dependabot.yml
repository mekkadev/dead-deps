# A tool about stale dependencies has no excuse for carrying its own.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # TypeScript majors change type-checking semantics and break the build on
      # arrival; that is a deliberate migration, not a routine bump.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      # Routine bumps arrive as one reviewable PR; majors stay separate.
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps(dev)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: 'ci'
