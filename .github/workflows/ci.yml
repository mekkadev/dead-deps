name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push to a branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # No test in this suite touches the network; a run that tries to is a bug
      # worth failing on rather than a flake worth retrying.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
