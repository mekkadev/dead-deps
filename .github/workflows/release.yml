name: Release

# Pushing a v* tag cuts the release. The checks run first, so a tag can never
# produce a release from a tree that does not build — and the notes come out of
# CHANGELOG.md rather than being retyped, so the two cannot drift.
#
# Publishing to npm is opt-in: it happens only once an NPM_TOKEN secret exists.
# Until then the GitHub release is still created, and the job reports plainly
# that it skipped the registry rather than failing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.0. Created from the current commit if it does not exist yet.'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # On a tag push, check out the tag. On a manual run the tag may not exist
      # yet, so fall back to the branch the run was started from.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Refuse to release if the tag and package.json disagree
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json ($PKG)"
            exit 1
          fi
          echo "tag and package.json agree on $TAG"

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the tag if this run had to make it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/$TAG"
            echo "created tag $TAG at $(git rev-parse --short HEAD)"
          fi

      - name: Extract this version's notes from CHANGELOG.md
        id: notes
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # Everything between this version's heading and the next one.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::no CHANGELOG entry for $VERSION; falling back to a generated summary"
            echo "See [CHANGELOG.md](./CHANGELOG.md)." > release-notes.md
          fi
          echo "--- notes ---"; cat release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md --title "$TAG"
          else
            gh release create "$TAG" --notes-file release-notes.md --title "$TAG" --verify-tag
          fi

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Publish to npm, or explain why not
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set — skipping the registry."
            echo "Add it under Settings → Secrets and variables → Actions to publish."
            exit 0
          fi
          npm ci
          npm run build
          # Provenance ties the published tarball to this workflow run.
          npm publish --provenance --access public
