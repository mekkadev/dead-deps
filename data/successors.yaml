# successors.yaml — the curated succession dataset behind dead-deps.
#
# Each row maps an npm package that is dead, deprecated or superseded to the
# successor the ecosystem actually moved to, with primary-source evidence.
# Every row is hand-verified against those sources by a human; machine-generated
# guesses do not belong in this file.
#
# Rows are unique by `from` and sorted alphabetically by `from`.
#
# Contributors: read data/SCHEMA.md before adding or editing a row. It defines the
# inclusion rules, every field, the `type` enum and the house style.

- from: "@angular/http"
  to: "@angular/common"
  toKind: package
  type: absorbed
  confidence: high
  since: "2019-05"
  dropIn: false
  alternatives: []
  notes: >-
    Angular's original HTTP client was folded into @angular/common as
    HttpClientModule in Angular 4.3, and the standalone @angular/http package
    was removed in Angular 8. The npm package carries a deprecation notice
    pointing at @angular/common, and the v8 deprecations guide states that the
    entire @angular/http package has been removed. Its final release, 7.2.16,
    shipped in January 2020.
  migration: >-
    Import HttpClientModule from @angular/common/http and inject HttpClient.
    Drop the manual .json() call on responses, since HttpClient parses JSON by
    default.
  evidence:
    - label: npm deprecation notice on @angular/http
      url: https://www.npmjs.com/package/@angular/http
    - label: "Angular v8 deprecations guide: \"The entire @angular/http package has
        been removed. Use @angular/common/http instead.\""
      url: https://github.com/angular/angular/blob/8.0.x/aio/content/guide/deprecations.md

- from: "@hapi/joi"
  to: joi
  toKind: package
  type: rename
  confidence: high
  since: "2020-03"
  dropIn: true
  alternatives:
    - zod
    - yup
    - ajv
  notes: >-
    Joi spent a period inside the @hapi scope and then moved back to the plain
    joi name when it became a standalone project again. @hapi/joi stopped at
    17.1.1 in March 2020 with the npm notice "Switch to 'npm install joi'", and
    joi 17.1.1 was published under the unscoped name a few months later.
    Development continues there.
  migration: >-
    Replace the dependency with `joi` at version 17 or later and change
    `require('@hapi/joi')` to `require('joi')`; joi 17 is the same codebase, so
    schemas carry over unchanged.
  evidence:
    - label: npm deprecation notice for @hapi/joi ("Switch to 'npm install joi'")
      url: https://www.npmjs.com/package/@hapi/joi
    - label: joi repository, documenting `npm install joi`
      url: https://github.com/hapijs/joi

- from: "@material-ui/core"
  to: "@mui/material"
  toKind: package
  type: rename
  confidence: high
  since: "2021-09"
  dropIn: false
  alternatives: []
  notes: >-
    Material-UI was renamed MUI in 2021 and its packages moved from the
    @material-ui/* scope to @mui/*. The npm deprecation notice on
    @material-ui/core states that v4 has not received active development since
    September 2021 and links to the official v4 to v5 migration guide. The last
    v4 release was 4.12.4 in April 2022.
  migration: >-
    MUI ships codemods: npx @mui/codemod v5.0.0/preset-safe src handles most
    import paths and prop renames, then work through the remaining manual steps
    in the migration guide.
  evidence:
    - label: npm deprecation notice on @material-ui/core
      url: https://www.npmjs.com/package/@material-ui/core
    - label: Official MUI v4 to v5 migration guide
      url: https://mui.com/material-ui/migration/migration-v4/

- from: "@zeit/next-sass"
  to: next
  toKind: package
  type: absorbed
  confidence: high
  since: "2020-03"
  dropIn: false
  alternatives:
    - sass
  notes: >-
    Next.js added built-in CSS support in 9.2 and built-in Sass support in 9.3
    (March 2020), which made the next-css and next-sass plugins unnecessary; the
    9.3 release post explicitly recommends removing @zeit/next-sass from
    next.config.js and package.json. The package carries an npm deprecation
    notice pointing at the built-in support, its last release was in September
    2018, and the @zeit scope itself was retired when the company became Vercel.
  migration: >-
    Remove the plugin from next.config.js, add `sass` as a devDependency, and
    import .scss files directly from components; put global styles in
    pages/_app.
  evidence:
    - label: npm deprecation notice for @zeit/next-sass (points at Next.js built-in
        Sass support)
      url: https://www.npmjs.com/package/@zeit/next-sass
    - label: "Next.js 9.3 release notes: built-in Sass support, \"we recommend
        removing the plugin\""
      url: https://nextjs.org/blog/next-9-3
    - label: Next.js CSS documentation
      url: https://nextjs.org/docs/app/getting-started/css

- from: angular
  to: "@angular/core"
  toKind: package
  type: reimplementation
  confidence: high
  since: "2022-01"
  dropIn: false
  alternatives:
    - vue
    - react
    - svelte
  notes: >-
    AngularJS, published as the unscoped angular package, reached end of support
    in January 2022; the official version support page states this and the npm
    deprecation notice points at @angular/core. The final release, 1.8.3,
    shipped in April 2022. Modern Angular is a ground-up rebuild by the same
    team, published under the @angular/* scope rather than as a new major of the
    same library.
  migration: >-
    There is no automatic upgrade. The documented route is incremental: run both
    frameworks together via ngUpgrade and move component by component, or
    rewrite the application.
  evidence:
    - label: npm deprecation notice on angular pointing at @angular/core
      url: https://www.npmjs.com/package/angular
    - label: AngularJS version support status (official docs)
      url: https://docs.angularjs.org/misc/version-support-status

- from: apollo-server
  to: "@apollo/server"
  toKind: package
  type: rename
  confidence: high
  since: "2023-11"
  dropIn: false
  alternatives:
    - graphql-yoga
    - graphql-http
  notes: >-
    apollo-server was the batteries-included entry point for Apollo Server v2
    and v3, both of which Apollo has declared end-of-life. The npm notice
    directs users to the @apollo/server package, the same project published
    under the Apollo scope. The final release under the old name was 3.13.0 in
    November 2023, and Apollo Server 5 is the currently supported line.
  migration: >-
    Replace it with @apollo/server plus `startStandaloneServer(server, {listen:
    {port: 4000}})` from `@apollo/server/standalone`, which is the equivalent of
    the old `server.listen()` convenience API.
  evidence:
    - label: npm deprecation notice for apollo-server
      url: https://www.npmjs.com/package/apollo-server
    - label: Apollo Server previous-versions and end-of-life documentation
      url: https://www.apollographql.com/docs/apollo-server/previous-versions

- from: apollo-server-express
  to: "@apollo/server"
  toKind: package
  type: rename
  confidence: high
  since: "2023-11"
  dropIn: false
  alternatives:
    - graphql-yoga
    - graphql-http
  notes: >-
    apollo-server-express is the Express integration from Apollo Server v2 and
    v3. Apollo declared v2 end-of-life in October 2023 and v3 end-of-life in
    October 2024, and the npm notice states that this functionality now lives in
    the @apollo/server package. The final release was 3.13.0 in November 2023.
    Note that Apollo Server 4 has also since reached end-of-life (January 2026),
    so v5 is the current target.
  migration: >-
    Install @apollo/server v5 together with the separate
    `@as-integrations/express4` package (or `@as-integrations/express5` on
    Express 5), then `await server.start()` before `app.use('/graphql',
    express.json(), expressMiddleware(server))` — the old `applyMiddleware`
    started the server implicitly.
  evidence:
    - label: npm deprecation notice for apollo-server-express
      url: https://www.npmjs.com/package/apollo-server-express
    - label: Apollo Server previous-versions and end-of-life documentation
      url: https://www.apollographql.com/docs/apollo-server/previous-versions
    - label: Official "Migrating from Apollo Server 3" guide
      url: https://www.apollographql.com/docs/apollo-server/migration-from-v3

- from: babel-eslint
  to: "@babel/eslint-parser"
  toKind: package
  type: rename
  confidence: high
  since: "2020-02"
  dropIn: false
  alternatives: []
  notes: >-
    babel-eslint was moved into the main Babel monorepo and republished as
    @babel/eslint-parser. The old package's last release was 10.1.0 in February
    2020 and its npm deprecation notice states it will no longer receive
    updates. The scoped parser is the same project under the new name.
  migration: >-
    Install @babel/eslint-parser, set `parser: "@babel/eslint-parser"` in your
    ESLint config, and make sure a Babel config file is resolvable — the new
    parser reads your real Babel config instead of inferring one.
  evidence:
    - label: npm deprecation notice for babel-eslint ("babel-eslint is now
        @babel/eslint-parser. This package will no longer receive updates.")
      url: https://www.npmjs.com/package/babel-eslint
    - label: "@babel/eslint-parser documentation"
      url: https://babeljs.io/docs/babel-eslint-parser

- from: babel-preset-es2015
  to: "@babel/preset-env"
  toKind: package
  type: self-declared
  confidence: high
  since: "2017-04"
  dropIn: false
  alternatives: []
  notes: >-
    Babel replaced its year-based presets with a single preset that compiles
    according to the browsers and Node versions you actually target.
    babel-preset-es2015's last release was 6.24.1 in April 2017 and it is
    deprecated on npm with a notice from the Babel team recommending preset-env;
    it was not carried forward into Babel 7, where the package is
    @babel/preset-env. Targeting real environments usually produces smaller
    output than compiling everything down to ES5.
  migration: >-
    Replace the preset with @babel/preset-env and declare targets through a
    browserslist config or the preset's `targets` option; with no targets set it
    behaves roughly like the old es2015 preset.
  evidence:
    - label: npm deprecation notice for babel-preset-es2015 ("we recommend using
        babel-preset-env now")
      url: https://www.npmjs.com/package/babel-preset-es2015
    - label: "@babel/preset-env documentation"
      url: https://babeljs.io/docs/babel-preset-env

- from: bluebird
  to: Promise (native)
  toKind: platform
  type: absorbed
  confidence: high
  since: "2019-11"
  dropIn: false
  alternatives:
    - p-limit
    - p-map
    - p-retry
  notes: >-
    Bluebird's README now tells readers to "use native promises instead if at
    all possible", noting that native promises have been stable and fast for
    about a decade and that most of Bluebird's useful features were absorbed
    into the language. The last release was 3.7.2 in November 2019; the package
    is not formally deprecated on npm and still works. The maintainer suggests
    keeping Bluebird only for very old browsers, end-of-life Node.js, or
    temporarily for its warnings and monitoring.
  migration: >-
    Delete the `require('bluebird')` and rely on the global Promise; for the
    concurrency helpers Bluebird provided, `Promise.map` maps onto p-map and
    `Promise.promisify` onto `util.promisify`.
  evidence:
    - label: Bluebird README recommending native promises
      url: https://github.com/petkaantonov/bluebird
    - label: npm package page showing the last release in 2019
      url: https://www.npmjs.com/package/bluebird

- from: boom
  to: "@hapi/boom"
  toKind: package
  type: rename
  confidence: high
  since: "2018-11"
  dropIn: false
  alternatives:
    - http-errors
  notes: >-
    boom builds HTTP-friendly error objects and moved into the @hapi scope in
    late 2018. The unscoped package stopped at 7.3.0 and its npm notice says the
    module has moved to @hapi/boom. Outside the hapi ecosystem, http-errors
    covers the same ground for Express and Connect apps.
  migration: >-
    Install @hapi/boom and update the require path; the error factory functions
    such as `Boom.badRequest()` keep the same names across the rename, though
    the major-version jump from 7 to 10 has its own breaking changes.
  evidence:
    - label: npm deprecation notice for boom
      url: https://www.npmjs.com/package/boom
    - label: Maintained scoped package
      url: https://www.npmjs.com/package/@hapi/boom

- from: casperjs
  to: playwright
  toKind: package
  type: replacement
  confidence: medium
  since: "2018-03"
  dropIn: false
  alternatives:
    - puppeteer
    - "@playwright/test"
    - cypress
  notes: >-
    CasperJS is a scripting layer on top of PhantomJS, and PhantomJS development
    was suspended in March 2018. The CasperJS repository is archived and its own
    description begins "CasperJS is no longer actively maintained"; the last
    release was 1.1.4 in May 2017. Headless Chrome and headless Firefox now
    cover the same use cases with maintained drivers.
  migration: >-
    CasperJS step chains map onto plain async/await scripts;
    `casper.start().then(...)` becomes `await page.goto(...)` followed by
    ordinary awaited actions.
  evidence:
    - label: casperjs/casperjs repository (archived, "no longer actively maintained")
      url: https://github.com/casperjs/casperjs
    - label: "PhantomJS README: development is suspended until further notice"
      url: https://github.com/ariya/phantomjs#readme
    - label: "PhantomJS issue 15344: archiving the project, suspending development
        (March 2018)"
      url: https://github.com/ariya/phantomjs/issues/15344

- from: codecov
