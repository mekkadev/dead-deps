- from: colors
  to: "@colors/colors"
  toKind: package
  type: fork
  confidence: medium
  since: "2022-01"
  dropIn: true
  alternatives:
    - chalk
    - picocolors
    - ansi-colors
    - kleur
  notes: >-
    In January 2022 the 1.4.44-liberty-2 release of colors.js printed an endless
    stream of garbage characters, which broke builds across the ecosystem; 1.4.1
    and 1.4.2 followed with the same behaviour, and npm pointed the latest tag
    back at 1.4.0, where it still sits. Nothing has been published since.
    @colors/colors is the same codebase republished under a scope by a colors.js
    maintainer and is what several downstream projects, including Winston, now
    depend on; its own last release was 1.6.0 in July 2023, so treat it as
    stable rather than actively developed. Many other projects took the
    opportunity to drop prototype patching entirely for chalk or picocolors.
  migration: >-
    @colors/colors is API-identical, so require('colors') becomes
    require('@colors/colors'). Moving to picocolors or chalk means rewriting
    'text'.red as red('text').
  evidence:
    - label: "Marak/colors.js issue #285, opened by the author about the
        v1.4.44-liberty-2 release"
      url: https://github.com/Marak/colors.js/issues/285
    - label: "@colors/colors on npm (maintained scoped build)"
      url: https://www.npmjs.com/package/@colors/colors

- from: connect-multiparty
  to: multer
  toKind: package
  type: replacement
  confidence: medium
  since: "2018-09"
  dropIn: false
  alternatives:
    - busboy
    - multiparty
    - formidable
  notes: >-
    connect-multiparty wrapped the multiparty parser as Connect middleware; its
    last release was 2.2.0 in September 2018 and the Express team archived the
    repository on 14 May 2025 with an npm notice saying the package is archived
    and no longer maintained. The README already advised against it, saying "I
    actually recommend against using this module. It's cleaner to use the
    multiparty API directly", and warning that its temporary files are never
    cleaned up automatically. Most Express projects have settled on multer for
    multipart uploads.
  migration: >-
    Replace the middleware with `multer({dest})`; uploaded files move from
    `req.files` keyed by field name to multer's `req.file` / `req.files` shape,
    so file-handling code needs adjusting.
  evidence:
    - label: Archived repository with the README recommendation
      url: https://github.com/expressjs/connect-multiparty
    - label: npm deprecation notice for connect-multiparty
      url: https://www.npmjs.com/package/connect-multiparty

- from: create-react-app
  to: vite
  toKind: package
  type: self-declared
  confidence: medium
  since: "2025-02"
  dropIn: false
  alternatives:
    - next
    - react-router
    - expo
    - "@rsbuild/core"
    - parcel
  notes: >-
    The React team deprecated Create React App for new apps in February 2025;
    the post states CRA has no active maintainers, and the 5.1.0 release
    published at the same time prints a deprecation warning on install. React's
    own guidance points new projects at a framework such as Next.js, React
    Router or Expo first, and names Vite, Parcel and Rsbuild for people who want
    to roll their own setup. Vite is the usual destination for a plain
    single-page app, but a framework is the team's primary recommendation, so
    treat `to` as situational.
  migration: >-
    For a plain SPA: move public/index.html to the project root and rewrite its
    %PUBLIC_URL% placeholders, replace react-scripts with vite and
    @vitejs/plugin-react, and rename REACT_APP_ environment variables to VITE_.
  evidence:
    - label: "React blog: Sunsetting Create React App (14 Feb 2025)"
      url: https://react.dev/blog/2025/02/14/sunsetting-create-react-app
    - label: "Create React App README: the project is in long-term stasis and
        migration is recommended"
      url: https://github.com/facebook/create-react-app

- from: csurf
  to: csrf-csrf
  toKind: package
  type: replacement
  confidence: medium
  since: "2020-01"
  dropIn: false
  alternatives:
    - "@dr.pogodin/csurf"
    - lusca
    - tiny-csrf
  notes: >-
    csurf was the standard Express CSRF middleware; its last release was 1.11.0
    in January 2020, and the Express team archived the repository on 14 May 2025
    with an npm notice saying the package is archived and no longer maintained.
    No official replacement was named. csrf-csrf, which implements the
    double-submit cookie pattern, is the most widely installed of the actively
    maintained options, and @dr.pogodin/csurf is a maintained fork if you need
    the original API.
  migration: >-
    csrf-csrf is configured through `doubleCsrf({getSecret, cookieName})`, which
    returns the middleware and a token generator; the template-side call changes
    from `req.csrfToken()` to the generator returned by that factory.
  evidence:
    - label: Archived expressjs/csurf repository (archived 14 May 2025)
      url: https://github.com/expressjs/csurf
    - label: npm deprecation notice for csurf
      url: https://www.npmjs.com/package/csurf

- from: cucumber
