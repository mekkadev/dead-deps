  toKind: package
  type: rename
  confidence: high
  since: "2020-12"
  dropIn: true
  alternatives: []
  notes: >-
    The Cucumber project moved its JavaScript implementation to the @cucumber
    scope, publishing @cucumber/cucumber 7.0.0 in December 2020; the unscoped
