  migration: >-
    Swap the dependency and update imports from `cucumber` to
    `@cucumber/cucumber`; step definition and world APIs are unchanged across
    the rename itself, though moving from 6.x to 7.x has its own breaking
    changes.
  evidence:
    - label: npm deprecation notice on cucumber ("publishing new releases under
        @cucumber/cucumber")
      url: https://www.npmjs.com/package/cucumber
    - label: cucumber-js installation docs (scoped package)
      url: https://github.com/cucumber/cucumber-js/blob/main/docs/installation.md

- from: cuid
  to: "@paralleldrive/cuid2"
  toKind: package
  type: reimplementation
  confidence: high
  since: "2023-01"
  dropIn: false
  alternatives:
    - nanoid
    - uuid
  notes: >-
    cuid carries an npm deprecation notice from its author stating that cuid and
    similar k-sortable, non-cryptographic identifiers are insecure, and pointing
    at @paralleldrive/cuid2. Cuid2 is a ground-up rewrite by the same author
    built on a cryptographically secure hash. Identifiers produced by the two
    are not interchangeable.
  migration: >-
    cuid() becomes createId() from @paralleldrive/cuid2. Cuid2 ids are
    deliberately not sortable, so anything that relied on cuid's rough ordering
    needs its own timestamp column.
  evidence:
    - label: npm deprecation notice on cuid
      url: https://www.npmjs.com/package/cuid
    - label: paralleldrive/cuid2 repository
      url: https://github.com/paralleldrive/cuid2

- from: enzyme
  to: "@testing-library/react"
  toKind: package
  type: replacement
  confidence: high
  since: "2019-12"
  dropIn: false
  alternatives:
    - cypress
    - vitest
  notes: >-
    Enzyme's last release was 3.11.0 in December 2019, and its README states
    that the officially provided adapters cover React 16.x, 15.x, 0.14.x and
    0.13.x only. The request for an official React 18 adapter (issue 2556) was
    closed without one being published, so projects on React 17 or newer have no
    supported adapter. The ecosystem, including the React documentation's
    testing guidance, moved to React Testing Library.
  migration: >-
    There is no mechanical conversion: shallow rendering and `wrapper.find(...)`
    have no direct equivalent, so tests are rewritten around `render()` and
    queries such as `screen.getByRole()`.
  evidence:
    - label: "enzyme README: officially provided adapters listed for React 16.x and
        older"
      url: https://github.com/enzymejs/enzyme#installation
    - label: "enzymejs/enzyme issue 2556: enzyme-adapter-react-18 request, closed
        without an adapter"
      url: https://github.com/enzymejs/enzyme/issues/2556
    - label: "npm: enzyme, last published December 2019"
      url: https://www.npmjs.com/package/enzyme

- from: eslint-loader
  to: eslint-webpack-plugin
  toKind: package
  type: self-declared
  confidence: high
  since: "2020-04"
  dropIn: false
  alternatives: []
  notes: >-
    webpack-contrib deprecated eslint-loader in favour of eslint-webpack-plugin,
    and the npm notice says so directly. Running the linter as a plugin instead
    of a loader lets it check files webpack never resolves and avoids re-linting
    on every module build. The loader's last release was 4.0.2 in April 2020.
  migration: >-
    Delete the loader rule and add `new ESLintPlugin({ extensions:
    ['js','jsx','ts','tsx'] })` to plugins. Loader options such as `fix` and
    `failOnError` map onto plugin options of the same name.
  evidence:
    - label: npm deprecation notice for eslint-loader ("This loader has been
        deprecated. Please use eslint-webpack-plugin")
      url: https://www.npmjs.com/package/eslint-loader
    - label: "webpack docs: ESLintPlugin"
      url: https://webpack.js.org/plugins/eslint-webpack-plugin/

- from: eslint-plugin-node
