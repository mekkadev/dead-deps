  migration: >-
    Rename the dependency and the config entry to
    @babel/plugin-transform-async-generator-functions. If you compile async generators
    down to ES5 you still need the regenerator runtime, exactly as before.
  evidence:
    - label: "npm deprecation notice (\"This proposal has been merged to the ECMAScript
        standard and thus this plugin is no longer maintained. Please use
        @babel/plugin-transform-async-generator-functions instead.\")"
      url: https://www.npmjs.com/package/@babel/plugin-proposal-async-generator-functions
    - label: "Babel 7.22.0 release post, \"Renamed packages\" table:
        proposal-async-generator-functions → transform-async-generator-functions
        (ES2018)"
      url: https://babeljs.io/blog/2023/05/26/7.22.0
    - label: "@babel/plugin-transform-async-generator-functions documentation"
      url: https://babeljs.io/docs/babel-plugin-transform-async-generator-functions

