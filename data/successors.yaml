# successors.yaml — the curated succession dataset behind dead-deps.
#
# Each row maps an npm package that is dead, deprecated or superseded to the
# successor the ecosystem actually moved to, with primary-source evidence.
# Every row is hand-verified against those sources by a human; machine-generated
# guesses do not belong in this file.
#
# Rows are unique by `from` and sorted alphabetically by `from`.
#
# Contributors: read data/SCHEMA.md before adding or editing a row. It defines the
# inclusion rules, every field, the `type` enum and the house style.


- from: "@angular-devkit/build-angular"
  to: "@angular/build"
  toKind: package
  type: reimplementation
  confidence: high
  since: "2026-06"
  dropIn: false
  alternatives: []
  notes: >-
    Angular rebuilt its application build pipeline on esbuild and Vite and split it out
    as @angular/build, first released alongside Angular v18 in May 2024. The
    webpack-based @angular-devkit/build-angular carries an npm deprecation notice naming
    that replacement on every release from 22.0.0 (June 2026) onward. Builder names in
    angular.json change with it, so this is a configuration change rather than a
    straight dependency swap.
  migration: >-
    Run `ng update @angular/cli --name use-application-builder` to move angular.json
    onto @angular/build. Application and SSR code has to be ESM-compatible, so remove
    CommonJS assumptions such as require, __filename and __dirname.
  evidence:
    - label: "npm deprecation notice (\"Angular's Webpack support is deprecated. Use the
        esbuild and Vite-based \\\"@angular/build\\\" package instead.\")"
      url: https://www.npmjs.com/package/@angular-devkit/build-angular
    - label: "Angular docs: migrating to the new esbuild/Vite build system, including
        `ng update @angular/cli --name use-application-builder`"
      url: https://angular.dev/tools/cli/build-system-migration

- from: "@angular/animations"
  to: "@angular/core"
  toKind: bundled
  type: absorbed
  confidence: medium
  since: "2025-08"
  dropIn: false
  alternatives: []
  notes: >-
    Angular deprecated @angular/animations from v20.2.0 (August 2025) in favour of the
    compiler-level animate.enter and animate.leave template bindings, which drive plain
    CSS animations with no animations runtime attached. Those bindings are part of the
    framework itself, so nothing extra needs installing; the package is still published
    alongside each Angular release. Enter and leave transitions map over cleanly, while
    longer sequenced animations written with the animate()/keyframes DSL have to be
    rewritten as CSS or handed to a dedicated animation library.
  migration: >-
    Drop provideAnimations()/BrowserAnimationsModule and the @angular/animations
    dependency, then express enter and leave transitions with the animate.enter and
    animate.leave bindings plus CSS keyframes.
  evidence:
    - label: "npm deprecation notice (\"@angular/animations is deprecated. Use
        `animate.enter` and `animate.leave` instead. For more information see:
        https://v22.angular.dev/guide/animations.\")"
      url: https://www.npmjs.com/package/@angular/animations
    - label: "Angular animations guide: \"Animating your applications with animate.enter
        and animate.leave\""
      url: https://angular.dev/guide/animations

- from: "@angular/flex-layout"
  to: CSS Flexbox and Grid
  toKind: platform
  type: absorbed
  confidence: high
  since: "2023-01"
  dropIn: false
  alternatives: []
  notes: >-
    The Angular team put flex-layout into long-term support and then deprecated it, on
    the grounds that CSS flexbox and grid now cover what the library was built to
    provide. Its npm deprecation notice links the team's "Modern CSS in Angular Layouts"
    post, and the final release was 15.0.0-beta.42 in January 2023. The replacement is
    stylesheet code, so there is nothing to install.
  migration: >-
    Translate the directives into CSS: fxLayout becomes `display: flex` plus
    `flex-direction`, fxFlex becomes a `flex` shorthand, and fxLayoutGap becomes `gap`.
    Responsive suffixes such as fxHide.lt-md become ordinary media queries or container
    queries.
  evidence:
    - label: "npm deprecation notice (\"This package has been deprecated. Please see
        https://blog.angular.io/modern-css-in-angular-layouts-4a259dca9127\")"
      url: https://www.npmjs.com/package/@angular/flex-layout
    - label: "Angular team post \"Modern CSS in Angular Layouts\", linked from the
        deprecation notice (now redirects to blog.angular.dev)"
      url: https://blog.angular.io/modern-css-in-angular-layouts-4a259dca9127

- from: "@angular/http"
  to: "@angular/common"
  toKind: package
  type: absorbed
  confidence: high
  since: "2019-05"
  dropIn: false
  alternatives: []
  notes: >-
    Angular's original HTTP client was folded into @angular/common as
    HttpClientModule in Angular 4.3, and the standalone @angular/http package
    was removed in Angular 8. The npm package carries a deprecation notice
    pointing at @angular/common, and the v8 deprecations guide states that the
    entire @angular/http package has been removed. Its final release, 7.2.16,
    shipped in January 2020.
  migration: >-
    Import HttpClientModule from @angular/common/http and inject HttpClient.
    Drop the manual .json() call on responses, since HttpClient parses JSON by
    default.
  evidence:
    - label: npm deprecation notice on @angular/http
      url: https://www.npmjs.com/package/@angular/http
    - label: "Angular v8 deprecations guide: \"The entire @angular/http package has
        been removed. Use @angular/common/http instead.\""
      url: https://github.com/angular/angular/blob/8.0.x/aio/content/guide/deprecations.md

- from: "@angular/platform-browser-dynamic"
  to: "@angular/platform-browser"
  toKind: bundled
  type: absorbed
  confidence: high
  since: "2025-07"
  dropIn: false
  alternatives: []
  notes: >-
    Angular folded the dynamic bootstrap entry points into @angular/platform-browser,
    and every release from 20.1.0 (July 2025) onward carries an npm deprecation notice
    pointing there. @angular/platform-browser is already a required peer dependency of
    this package, so the fix is to delete the dependency rather than install anything
    new. The package is still published in step with each Angular release while the
    deprecation window runs.
  migration: >-
    Remove @angular/platform-browser-dynamic and call platformBrowser() from
    @angular/platform-browser instead of platformBrowserDynamic(); in tests use
    BrowserTestingModule and platformBrowserTesting() from
    @angular/platform-browser/testing. Outside the CLI, add an explicit import of
    @angular/compiler if you rely on JIT compilation.
  evidence:
    - label: "npm deprecation notice (\"@angular/platform-browser-dynamic is deprecated.
        Use `@angular/platform-browser` instead.\")"
      url: https://www.npmjs.com/package/@angular/platform-browser-dynamic
    - label: "Angular API reference for platformBrowserDynamic, marked deprecated: \"Use
        the platformBrowser function instead from @angular/platform-browser. In case you
        are not in a CLI app and rely on JIT compilation, you will also need to import
        @angular/compiler\""
      url: https://angular.dev/api/platform-browser-dynamic/platformBrowserDynamic

