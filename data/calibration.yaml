# Calibration corpus — hand-labelled ground truth for the detector.
#
# WHAT THIS IS
# ------------
# A deliberately adversarial set of real npm packages, each with a ground-truth
# `label` drawn from `MaintenanceState` in `src/types.ts`. It is the yardstick
# the detector is scored against: run the scorer over these names, compare its
# verdict to `label`, and the resulting precision/recall numbers are what the
# README publishes. Because those numbers are published, every label here has
# to survive an outside reader checking it, so every row carries a one-sentence
# `rationale` and at least one primary source under `evidence`.
#
# WHY THE `stable-complete` BUCKET EXISTS
# ---------------------------------------
# This is the most important bucket in the file, and it exists specifically to
# catch false positives.
#
# The naive way to detect an abandoned package is to read the date of its last
# release and call anything old "dead". That heuristic scores well on obviously
# dead projects and is still worthless, because the npm dependency graph rests
# on a layer of tiny packages that were *finished* years ago: `once`, `wrappy`,
# `util-deprecate`, `imurmurhash`. They do one small thing, they do it
# correctly, there is nothing left to add, and so nobody commits to them. They
# are indistinguishable from abandoned packages on release date alone, and they
# are downloaded hundreds of millions of times a week. A tool that tells its
# user to migrate off `inherits` has not found a problem; it has become one.
#
# So the `stable-complete` rows are not filler. They are the trap. A detector
# that flags them fails calibration no matter how well it does elsewhere, and
# the false-positive rate over this bucket is reported separately.
#
# The `deprecated` bucket contains two rows — `code-point-at` and
# `path-is-absolute` — that are the same trap inverted: micro-libraries that
# look exactly like the `stable-complete` set (tiny, ancient, sindresorhus,
# millions of downloads) but that carry a real npm deprecation notice and an
# archived repository. A detector cannot pass this corpus by learning "small
# and old means fine" either.
#
# LABEL DEFINITIONS
# -----------------
#   active           Shipping releases and taking commits now.
#   stable-complete  Finished. Quiet because it is done, not because it is
#                    dead. No deprecation, no archived repo, still correct.
#   low-activity     Really maintained, just slowly: a trickle of commits, long
#                    gaps between releases, often a bus factor of one.
#   unmaintained     Genuinely dead — no releases and effectively no commits for
#                    years — but never formally deprecated, so nothing in the
#                    registry warns you.
#   deprecated       Formally retired: an npm deprecation notice on the latest
#                    version, or an archived source repository, or both.
#
# METHOD
# ------
# Every row was checked on 2026-08-04 against two sources: the npm registry
# document (`dist-tags.latest`, that version's `deprecated` field, and its
# publish time from `time`) and the ecosyste.ms package/repository/commits APIs
# (archived flag, last push, commits in the trailing year). Release dates and
# commit counts quoted in the rationales come from those two reads. Where the
# two disagreed — ecosyste.ms mirrors lag by months — the npm registry was
# treated as authoritative for release facts and the repository host for commit
# facts.
#
# MAINTENANCE
# -----------
# Labels drift. `low-activity` becomes `unmaintained`; `unmaintained` acquires a
# deprecation notice and becomes `deprecated`. Re-verify before quoting the
# precision numbers in a release, and never edit a label without also editing
# the rationale and the evidence that justify it.
#
# Style: state facts, not judgements. "No releases since 2019" is a fact.
# "Neglected" is an insult, and maintaining any of these for free was a gift.

# ---------------------------------------------------------------------------
# active — obviously healthy, should never be flagged
# ---------------------------------------------------------------------------

