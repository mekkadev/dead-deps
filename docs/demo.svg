<svg xmlns="http://www.w3.org/2000/svg" width="668" height="743" viewBox="0 0 668 743" role="img" aria-label="dead-deps scanning a project: request is reported as a hijack risk with three cited pieces of evidence, undici is named as its successor, and eight other dependencies are examined and deliberately not flagged">
<title>npx dead-deps</title>
<style>
  .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; }

  /* Playback is two background-coloured covers sliding off the content,
     stepped once per line so the session appears at reading speed.
     Only `transform` is animated — the one property every renderer that
     honours CSS in SVG animates reliably.
     Each cover's resting position is off the content, so a renderer that
     drops animation shows the finished frame rather than an empty panel. */
  .cover-out { transform: translateY(678px); animation: sweep 9s steps(35, end) infinite; }
  @keyframes sweep {
    0%, 10.0% { transform: translateY(0) }
    42.0%, 100% { transform: translateY(678px) }
  }

  .cover-cmd, .caret { transform: translateX(101.4px); animation: type 9s steps(13, end) infinite; }
  @keyframes type {
    0% { transform: translateX(0) }
    10.0%, 100% { transform: translateX(101.4px) }
  }

  .caret { animation-name: type, blink; animation-duration: 9s, 1.06s; animation-timing-function: steps(13, end), steps(1, end); }
  @keyframes blink { 0%, 55% { opacity: 1 } 55.01%, 100% { opacity: 0 } }

  @media (prefers-reduced-motion: reduce) {
    .cover-out, .cover-cmd, .caret { animation: none }
  }
</style>
<clipPath id="panel"><rect width="668" height="743" rx="10"/></clipPath>
<rect width="668" height="743" rx="10" fill="#0d1117"/>
<g clip-path="url(#panel)">
  <g class="t">
    <text x="22" y="39" fill="#57606a">$</text>
    <text x="37.6" y="39" fill="#c9d1d9" xml:space="preserve">npx dead-deps</text>
<text x="22" y="77"><tspan fill="#a371f7" xml:space="preserve">  dead-deps  ·  ~/projects/checkout-api</tspan></text>
<text x="22" y="96"><tspan fill="#21262d" xml:space="preserve">  ──────────────────────────────────────────────────────────────────────────────</tspan></text>
<text x="22" y="115"><tspan fill="#6e7681" xml:space="preserve">  package-lock.json (npm lockfile v3) · 9 of 423 dependencies examined ·</tspan></text>
<text x="22" y="134"><tspan fill="#6e7681" xml:space="preserve">  1 flagged · 414 skipped · 228ms</tspan></text>
<text x="22" y="153"></text>
<text x="22" y="172"><tspan fill="#f85149" xml:space="preserve">  HIJACK RISK</tspan><tspan fill="#c9d1d9" xml:space="preserve"> request 2.88.2</tspan><tspan fill="#6e7681" xml:space="preserve">                                       score 100/100</tspan></text>
<text x="22" y="191"><tspan fill="#c9d1d9" xml:space="preserve">    Unattended, still widely installed, and carrying open advisories —</tspan></text>
<text x="22" y="210"><tspan fill="#c9d1d9" xml:space="preserve">    deprecated on npm, no release in 6.5 years. This is the profile supply-chain</tspan></text>
<text x="22" y="229"><tspan fill="#c9d1d9" xml:space="preserve">    attackers look for.</tspan></text>
<text x="22" y="248"></text>
<text x="22" y="267"><tspan fill="#21262d" xml:space="preserve">    ├─ </tspan><tspan fill="#c9d1d9" xml:space="preserve">Deprecated on npm: &quot;request has been deprecated, see</tspan></text>
<text x="22" y="286"><tspan fill="#21262d" xml:space="preserve">    │  </tspan><tspan fill="#c9d1d9" xml:space="preserve">https://github.com/request/request/issues/3142&quot;</tspan></text>
<text x="22" y="305"><tspan fill="#21262d" xml:space="preserve">    │  ↳ </tspan><tspan fill="#58a6ff" xml:space="preserve">https://www.npmjs.com/package/request</tspan></text>
<text x="22" y="324"><tspan fill="#21262d" xml:space="preserve">    ├─ </tspan><tspan fill="#c9d1d9" xml:space="preserve">No release in 6.5 years — 169x longer than this package has ever gone</tspan></text>
<text x="22" y="343"><tspan fill="#21262d" xml:space="preserve">    │  </tspan><tspan fill="#c9d1d9" xml:space="preserve">quiet before (its own median gap between releases is 8 days).</tspan></text>
<text x="22" y="362"><tspan fill="#21262d" xml:space="preserve">    │  ↳ </tspan><tspan fill="#58a6ff" xml:space="preserve">https://www.npmjs.com/package/request</tspan></text>
<text x="22" y="381"><tspan fill="#21262d" xml:space="preserve">    └─ </tspan><tspan fill="#c9d1d9" xml:space="preserve">26 issues opened in the past year, 3 closed (12%), averaging 0.3 comments</tspan></text>
<text x="22" y="400"><tspan fill="#c9d1d9" xml:space="preserve">       each — people are asking and nobody is answering.</tspan></text>
<text x="22" y="419"><tspan fill="#21262d" xml:space="preserve">       ↳ </tspan><tspan fill="#58a6ff" xml:space="preserve">https://github.com/request/request</tspan></text>
<text x="22" y="438"></text>
<text x="22" y="457"><tspan fill="#c9d1d9" xml:space="preserve">    </tspan><tspan fill="#3fb950" xml:space="preserve">→ </tspan><tspan fill="#3fb950" xml:space="preserve">undici</tspan></text>
<text x="22" y="476"><tspan fill="#c9d1d9" xml:space="preserve">      what the ecosystem moved to · needs code changes · dead since 2020-02</tspan></text>
<text x="22" y="495"><tspan fill="#c9d1d9" xml:space="preserve">      Node 18+ ships a global `fetch()` backed by undici, so most simple call</tspan></text>
<text x="22" y="514"><tspan fill="#c9d1d9" xml:space="preserve">      sites need no dependency at all; reach for `got` when you want retries,</tspan></text>
<text x="22" y="533"><tspan fill="#c9d1d9" xml:space="preserve">      hooks and streams in one package.</tspan></text>
<text x="22" y="552"><tspan fill="#6e7681" xml:space="preserve">      alternatives: got · axios · node-fetch · postman-request</tspan></text>
<text x="22" y="571"></text>
<text x="22" y="590"><tspan fill="#6e7681" xml:space="preserve">    confidence ●○○ low</tspan></text>
<text x="22" y="609"><tspan fill="#6e7681" xml:space="preserve">      data may be stale: upstream last synced this on 2024-10-28</tspan></text>
<text x="22" y="628"></text>
<text x="22" y="647"><tspan fill="#21262d" xml:space="preserve">  ──────────────────────────────────────────────────────────────────────────────</tspan></text>
<text x="22" y="666"><tspan fill="#c9d1d9" xml:space="preserve">  1 dependency needs attention. Start with request → undici (needs code</tspan></text>
<text x="22" y="685"><tspan fill="#c9d1d9" xml:space="preserve">  changes).</tspan></text>
<text x="22" y="704"><tspan fill="#6e7681" xml:space="preserve">  8 other dependencies were examined and deliberately not flagged — quiet is not</tspan></text>
<text x="22" y="723"><tspan fill="#c9d1d9" xml:space="preserve">  the same as dead.</tspan></text>
  </g>
  <rect class="cover-cmd" x="37.6" y="23" width="103.4" height="23" fill="#0d1117"/>
  <rect class="caret" x="37.6" y="27" width="7.8" height="15" fill="#57606a"/>
  <rect class="cover-out" x="0" y="65.6" width="668" height="678" fill="#0d1117"/>
</g>
<rect x="0.5" y="0.5" width="667" height="742" rx="10" fill="none" stroke="#21262d"/>
</svg>
